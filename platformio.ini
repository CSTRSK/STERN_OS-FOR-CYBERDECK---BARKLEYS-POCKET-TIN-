[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

board_build.f_cpu = 240000000L

build_unflags =
    -flto

build_flags =
    -Ofast
    -funroll-loops
    -DARDUINO_ARCH_ESP32
    -D FRAMESKIP
    -O3
    -DCORE_DEBUG_LEVEL=0
    -fno-exceptions
    -fno-rtti
    -fno-threadsafe-statics
    -DSPI_FREQUENCY=80000000

build_type = release

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.0
    arduino-libraries/NTPClient @ ^3.2.1
    tzapu/WiFiManager @ ^2.0.0
    adafruit/Adafruit TCA8418 @ ^1.0.0
    adafruit/Adafruit BusIO @ ^1.0.0
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit SSD1306@^2.5.7
    https://github.com/phenax/Anemoia-ESP32.git
    bodmer/TFT_eSPI@^2.5.0

    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue